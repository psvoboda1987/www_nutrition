<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Fat loss planner</title>
    <link rel="stylesheet" href="assets/css/fat_burn_calc.css">
    <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon">
</head>

<body>
    <section>
        <h1>Fat Loss Planner</h1>
        <div>
            <label for="weight">your current weight (kg)</label>
            <input type="number" id="weight" min="0">
        </div>
        <div>
            <label for="fatPercent">your current fat %</label>
            <input type="number" id="fatPercent" min="0" max="100">
        </div>
    </section>
    <hr>
    <section>
        <div id="fatWeight"></div>
        <div id="fatLossPlan"></div>
    </section>

    <script src="assets/js/fat_burn_calc.js"></script>
</body>

</html>
