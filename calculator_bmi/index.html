<!DOCTYPE html>
<html lang="cs">

<head>
    <title>Kalkulátor BMI a živin</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta content="programátor, vývojář webových stránek, kodér" name="keywords">
    <meta content="Vytvářím webové stránky a aplikace." name="description">
    <link rel="shortcut icon" href="../assets/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="../assets/css/core.css">
</head>

<body class="bg-light-gray">
    <section class="container">
        <h2 class="text-center">Kalkulátor denního příjmu živin</h2>

        <form class="maw-400 shadow p-30 border-radius-medium" id="bmi-form">
            <label>Věk</label>
            <div>
                <label class="d-inline normal mr-10">
                    <input class="bmi-form-element d-inline" type="radio" name="age" value="18-40" required> 18-40
                </label>
                <label class="d-inline normal">
                    <input class="bmi-form-element d-inline" type="radio" name="age" value="41+" required> 41+
                </label>
            </div>

            <label for="height">Výška [cm]</label>
            <input id="height" class="bmi-form-element" type="number" name="height" required>

            <label for="weight">Váha [kg]</label>
            <input id="weight" class="bmi-form-element" type="number" name="weight" required>

            <label>Pohlaví</label>
            <div>
                <label class="d-inline normal mr-10">
                    <input class="bmi-form-element d-inline" type="radio" name="gender" value="woman" required> Žena
                </label>
                <label class="d-inline normal">
                    <input class="bmi-form-element d-inline" type="radio" name="gender" value="man" required> Muž
                </label>
            </div>

            <label>Stupeň fyzické aktivity</label>
            <div>
                <label class="d-inline normal mr-10">
                    <input class="bmi-form-element d-inline" type="radio" name="activity" value="normal" required> Běžná
                </label>
                <label class="d-inline normal mr-10">
                    <input class="bmi-form-element d-inline" type="radio" name="activity" value="medium" required>
                    Střední
                </label>
                <label class="d-inline normal">
                    <input class="bmi-form-element d-inline" type="radio" name="activity" value="high" required> Vysoká
                </label>
            </div>
        </form>

        <div id="result"></div>
    </section>

    <script src="../assets/js/calculator_bmi.js"></script>
</body>

</html>
