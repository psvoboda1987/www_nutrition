<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Fat loss planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section>
        <h1>Fat Loss Planner</h1>
        <div>
            <label for="weight">your current weight (kg)</label>
            <input type="text" id="weight">
        </div>
        <div>
            <label for="fatPercent">your current fat %</label>
            <input type="text" id="fatPercent">
        </div>
    </section>
    <hr>
    <section>
        <div id="fatWeight"></div>
        <div id="fatLossPlan"></div>
    </section>

    <script src="script.js"></script>
</body>

</html>
